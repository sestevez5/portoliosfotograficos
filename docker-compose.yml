services:
  backend:
    image: ghcr.io/sestevez5/portoliosfotograficos-backend:latest
    restart: unless-stopped
    volumes:
      - ${DATOS_PATH}:/app/datos
    networks:
      - portfolio

  frontend:
    image: ghcr.io/sestevez5/portoliosfotograficos-frontend:latest
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    networks:
      - portfolio

networks:
  portfolio:
