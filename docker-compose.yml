services:
  backend:
    image: ghcr.io/sestevez5/portoliosfotograficos-backend:latest
    restart: unless-stopped
    volumes:
      # Fotos: lo único que se monta desde el host (NAS).
      - ${FOTOS_PATH:?Falta FOTOS_PATH en .env (ruta de la carpeta de fotos en el host)}:/app/fotos
      # Datos internos (base de datos y logos): volumen gestionado por Docker, no visible como
      # carpeta del host. Sobrevive a "docker compose pull && docker compose up -d".
      - datos-internos:/app/datos
    networks:
      - portfolio
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/tags"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    image: ghcr.io/sestevez5/portoliosfotograficos-frontend:latest
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - portfolio

networks:
  portfolio:

volumes:
  datos-internos:
