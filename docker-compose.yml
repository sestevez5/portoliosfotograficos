services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    volumes:
      - ${DATOS_PATH}:/app/datos
    networks:
      - portfolio

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    networks:
      - portfolio

networks:
  portfolio:
