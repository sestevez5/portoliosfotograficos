services:
  backend:
    image: ghcr.io/sestevez5/portoliosfotograficos-backend:latest
    restart: unless-stopped
    volumes:
      # Fotos: carpeta del host (NAS).
      - ${FOTOS_PATH:?Falta FOTOS_PATH en .env (ruta de la carpeta de fotos en el host)}:/app/fotos
      # Datos de la aplicación (base de datos, logos, miniaturas y fotos de perfil). Con DATOS_PATH,
      # una carpeta del host junto a la de fotos (lo recomendado en el NAS: se copian juntas); sin
      # ella, el volumen interno "datos-internos", gestionado por Docker y no visible en el host.
      - ${DATOS_PATH:-datos-internos}:/app/datos
    networks:
      - portfolio
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/tags"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    image: ghcr.io/sestevez5/portoliosfotograficos-frontend:latest
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - portfolio

networks:
  portfolio:

volumes:
  # Solo se usa si no se define DATOS_PATH.
  datos-internos:
