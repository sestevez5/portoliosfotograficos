# Backend (servicio "backend" de docker-compose.yml). Con nombre, para poder usarlo en un proxy_pass
# con variables ($request_uri) sin tener que configurar un "resolver".
upstream backend_app {
    server backend:3000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión de lo que es texto (JS, CSS, HTML, JSON, SVG, XML). Las fotos (AVIF, JPEG) ya van
    # comprimidas.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    # API y fotos servidas por el contenedor backend, mismo origen para el navegador. ^~: tienen
    # prioridad sobre las location por extensión de más abajo (p. ej. una foto .png).
    location ^~ /api/ {
        # Las fotos de las colecciones se suben de una en una, de hasta 25 MB (el backend lo
        # comprueba); nginx admite por defecto solo 1 MB.
        client_max_body_size 30m;
        proxy_pass http://backend:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /photos/ {
        proxy_pass http://backend:3000/photos/;
        proxy_set_header Host $host;
    }

    # Para los buscadores: los genera el backend con el catálogo (ver backend/src/services/seo.service.ts).
    location = /robots.txt {
        proxy_pass http://backend:3000/robots.txt;
        proxy_set_header Host $host;
    }

    location = /sitemap.xml {
        proxy_pass http://backend:3000/sitemap.xml;
        proxy_set_header Host $host;
    }

    # El index.html tal cual: la plantilla que lee el backend (PLANTILLA_HTML_URL) y el respaldo si el
    # backend no responde (@spa). No se indexa: cada página tiene su propia dirección.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex";
    }

    # Ficheros de Angular con un hash de 8 caracteres en el nombre (main-L3WC3Z42.js,
    # chunk-DbN_uxb4.js, styles-….css, media/inter-latin-400-normal-55WT6UWF.woff2): si cambian, cambia
    # el nombre, así que se guardan en caché un año sin volver a preguntar.
    location ~ "-[A-Za-z0-9_-]{8}\.(js|css|woff2?)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Iconos, fuentes y demás estáticos sin hash: una semana.
    location ~* \.(ico|svg|png|jpg|webp|avif|woff2?)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Cualquier otra ruta es una página de la aplicación (Angular): la sirve el backend, que devuelve
    # el index.html con el título, la descripción, la vista previa al compartir y los datos
    # estructurados de esa página, y su código de estado real (404 si no existe). Si el backend no
    # responde, el index.html tal cual (la web funciona igual, sin esos metadatos).
    location / {
        try_files $uri @pagina;
    }

    location @pagina {
        proxy_pass http://backend_app/pagina$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 502 503 504 = @spa;
    }

    location @spa {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }
}
