server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API y fotos servidas por el contenedor backend, mismo origen para el navegador.
    location /api/ {
        # Las fotos de las colecciones se suben de una en una, de hasta 25 MB (el backend lo
        # comprueba); nginx admite por defecto solo 1 MB.
        client_max_body_size 30m;
        proxy_pass http://backend:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /photos/ {
        proxy_pass http://backend:3000/photos/;
        proxy_set_header Host $host;
    }
    # Angular routing (SPA): cualquier ruta no encontrada cae en index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
