<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Portfolios Fotográfico</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <!-- Aplica el tema guardado antes de pintar la página, para que no se vea un instante el oscuro
       al cargar con el claro elegido (ver core/services/tema.ts, que lo gestiona después). -->
  <script>
    try {
      if (localStorage.getItem('tema') === 'claro') document.documentElement.dataset['tema'] = 'claro';
      if (localStorage.getItem('marco') === 'con') document.documentElement.dataset['marco'] = 'con';
    } catch {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
