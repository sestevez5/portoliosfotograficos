<section class="hero">
  <h1>Fotógrafos</h1>
  <p>Elige un fotógrafo para ver sus álbumes.</p>
</section>

<ul class="fotografo-list">
  @for (fotografo of fotografos(); track fotografo.slug) {
    <li>
      <a class="fotografo-card" [routerLink]="['/', fotografo.slug]">
        <h2>{{ fotografo.nombre }}</h2>
        <p>{{ fotografo.descripcion }}</p>
      </a>
    </li>
  } @empty {
    <li class="empty-state">No hay fotógrafos disponibles todavía.</li>
  }
</ul>
