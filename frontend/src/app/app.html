<div class="site">
  <!-- Franja superior estrecha, antes de la cabecera: la sesión del usuario. -->
  <div class="barra-sesion">
    <app-usuario-sesion />
  </div>

  <header class="site-header">
    <a class="brand" routerLink="/">Portfolios<span>.</span></a>
    @if (fotografo(); as f) {
      <a class="fotografo" [routerLink]="['/', f.nombreInformalNormalizado]">
        <img class="fotografo__logo" [src]="f.logoUrl" [alt]="nombreCompleto(f)" />
      </a>
    }
  </header>

  <main class="site-main">
    <router-outlet />
  </main>
</div>
