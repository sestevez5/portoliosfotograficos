<div class="site">
  <header class="site-header">
    <a class="brand" routerLink="/">Portfolio<span>.</span></a>
    @if (fotografo(); as f) {
      <a class="fotografo" [routerLink]="['/', f.slug]">
        <img class="fotografo__logo" [src]="f.logoUrl" [alt]="f.nombre" />
      </a>
    }
  </header>

  <main class="site-main">
    <router-outlet />
  </main>
</div>
