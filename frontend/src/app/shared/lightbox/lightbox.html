<div class="lightbox" (click)="close()">
  <button class="lightbox__close" type="button" (click)="close()" aria-label="Cerrar">&times;</button>

  @if (photos().length > 1) {
    <button class="lightbox__nav lightbox__nav--prev" type="button" (click)="$event.stopPropagation(); goTo(-1)" aria-label="Foto anterior">
      &#8249;
    </button>
  }

  <figure class="lightbox__content" (click)="$event.stopPropagation()">
    <img [src]="grande(current.url)" [alt]="current.titulo ?? ''" />
    @if (current.titulo) {
      <figcaption>{{ current.titulo }}</figcaption>
    }
  </figure>

  @if (photos().length > 1) {
    <button class="lightbox__nav lightbox__nav--next" type="button" (click)="$event.stopPropagation(); goTo(1)" aria-label="Foto siguiente">
      &#8250;
    </button>
  }
</div>
